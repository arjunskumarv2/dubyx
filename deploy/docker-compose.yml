# Dubyx — single EC2 host: Postgres + API + Caddy (TLS + static portal)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dubyx
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: dubyx
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dubyx -d dubyx"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dubyx:${DB_PASSWORD}@db:5432/dubyx
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: https://${DOMAIN}
      # Business-local time for journey planning (Riyadh = UTC+3)
      TZ_OFFSET_MINUTES: "180"
    volumes:
      # Customer photos, attendance selfies and invoice PDFs live on disk —
      # a named volume keeps them across redeploys
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  uploads:
  caddydata:
  caddyconfig:
